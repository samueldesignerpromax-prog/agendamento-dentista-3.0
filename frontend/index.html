<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦷 Clínica Dental</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ----- RESET E BASE ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f0f7ff, #e0ecf9);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app {
      max-width: 1200px;
      width: 100%;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 30px 35px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #0b3b5c, #2a7faa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .badge {
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      padding: 6px 20px;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 6px 16px rgba(255,117,140,0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }

    /* ----- FORMULÁRIO ----- */
    .card {
      background: white;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      border: 1px solid #e9f0f8;
    }
    .card h2 {
      font-size: 20px;
      color: #0b3b5c;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1e3d52;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #dfeaf3;
      border-radius: 16px;
      font-size: 15px;
      background: #fafdff;
      transition: 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #2a7faa;
      outline: none;
      box-shadow: 0 0 0 4px rgba(42,127,170,0.15);
    }
    .btn-primary {
      background: linear-gradient(135deg, #0b3b5c, #1f668f);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 6px 18px rgba(11,59,92,0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(11,59,92,0.35);
    }
    .success-msg {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 16px;
      margin-top: 14px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .appointments-list {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 2px dashed #dce7f0;
    }
    .appointments-list h3 {
      font-size: 17px;
      color: #0b3b5c;
      margin-bottom: 12px;
    }
    .appointment-item {
      background: #f8fcff;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid #2a7faa;
      transition: 0.2s;
    }
    .appointment-item:hover {
      background: #eef6fe;
      transform: translateX(4px);
    }
    .appointment-item .info .name { font-weight: 700; color: #1e3d52; }
    .appointment-item .info .details { font-size: 13px; color: #4a6a7f; }
    .remove-btn {
      background: #fce4e4;
      border: none;
      padding: 4px 14px;
      border-radius: 30px;
      color: #b33a3a;
      font-weight: 700;
      cursor: pointer;
    }
    .remove-btn:hover { background: #f5c2c2; }

    /* ----- CHAT BOT ----- */
    .chat-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 460px;
    }
    .chat-title {
      font-size: 20px;
      font-weight: 700;
      color: #0b3b5c;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-messages {
      flex: 1;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      padding-right: 4px;
    }
    .message {
      padding: 10px 16px;
      border-radius: 20px;
      max-width: 88%;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s;
    }
    .message.bot {
      background: #eef3f9;
      color: #1e3d52;
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }
    .message.user {
      background: linear-gradient(135deg, #0b3b5c, #1f668f);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }
    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .option-btn {
      background: white;
      border: 2px solid #2a7faa;
      color: #0b3b5c;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .option-btn:hover {
      background: #2a7faa;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42,127,170,0.3);
    }
    .chat-input-area {
      display: flex;
      gap: 10px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 16px;
      border: 2px solid #dfeaf3;
      border-radius: 40px;
      font-size: 14px;
      background: #fafdff;
    }
    .chat-input-area input:focus {
      border-color: #2a7faa;
      outline: none;
      box-shadow: 0 0 0 4px rgba(42,127,170,0.1);
    }
    .chat-input-area button {
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      border: none;
      padding: 0 24px;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 12px rgba(255,117,140,0.3);
    }
    .chat-input-area button:hover {
      transform: scale(1.05);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-track { background: #eef3f9; border-radius: 10px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #2a7faa; border-radius: 10px; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🦷 Clínica Dental</h1>
    <span class="badge">✨ Atendimento humanizado</span>
  </div>
  <div class="grid">
    <!-- FORMULÁRIO -->
    <div class="card">
      <h2>📋 Agendamento</h2>
      <form id="form">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" id="name" required placeholder="Seu nome" />
        </div>
        <div class="form-group">
          <label>Telefone</label>
          <input type="tel" id="phone" placeholder="(11) 99999-9999" />
        </div>
        <div class="form-group">
          <label>Data *</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label>Horário *</label>
          <input type="time" id="time" required />
        </div>
        <div class="form-group">
          <label>Tratamento *</label>
          <select id="treatment" required>
            <option value="">Selecione</option>
            <option value="Limpeza Profissional">Limpeza Profissional – R$ 120</option>
            <option value="Clareamento a Laser">Clareamento a Laser – R$ 450</option>
            <option value="Restauração com Resina">Restauração com Resina – R$ 300</option>
            <option value="Extração Simples">Extração Simples – R$ 200</option>
            <option value="Consulta + Avaliação">Consulta + Avaliação – R$ 150</option>
          </select>
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" id="price" step="0.01" readonly />
        </div>
        <button type="submit" class="btn-primary">✅ Agendar</button>
        <div id="feedback" class="success-msg">✔️ Agendamento salvo!</div>
      </form>

      <div class="appointments-list">
        <h3>📋 Meus agendamentos</h3>
        <div id="list"></div>
      </div>
    </div>

    <!-- CHAT BOT -->
    <div class="card chat-card">
      <div class="chat-title">💬 Assistente Dental</div>
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Digite..." />
        <button id="chatSend">Enviar</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  //  CONFIGURAÇÕES
  // ============================================================
  const STORAGE_KEY = 'appointments';

  // ============================================================
  //  FORMULÁRIO (salva no localStorage)
  // ============================================================
  const form = document.getElementById('form');
  const feedback = document.getElementById('feedback');
  const listEl = document.getElementById('list');

  // Preço automático
  const priceMap = {
    'Limpeza Profissional': 120,
    'Clareamento a Laser': 450,
    'Restauração com Resina': 300,
    'Extração Simples': 200,
    'Consulta + Avaliação': 150,
  };
  document.getElementById('treatment').addEventListener('change', function() {
    const val = this.value;
    document.getElementById('price').value = priceMap[val] ? priceMap[val].toFixed(2) : '';
  });

  // Carregar lista
  function loadAppointments() {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (data.length === 0) {
      listEl.innerHTML = '<p style="color:#4a6a7f;font-size:14px;">Nenhum agendamento ainda.</p>';
      return;
    }
    let html = '';
    data.forEach((app, index) => {
      html += `
        <div class="appointment-item">
          <div class="info">
            <span class="name">${app.name}</span>
            <span class="details">${app.treatment} – R$ ${app.price} • ${app.date} às ${app.time}</span>
          </div>
          <button class="remove-btn" onclick="removeAppointment(${index})">✕</button>
        </div>
      `;
    });
    listEl.innerHTML = html;
  }

  // Remover
  window.removeAppointment = function(index) {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    data.splice(index, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    loadAppointments();
  };

  // Enviar formulário
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const treatment = document.getElementById('treatment').value;
    const price = document.getElementById('price').value;

    if (!name || !date || !time || !treatment) {
      alert('Preencha todos os campos obrigatórios.');
      return;
    }

    const newApp = { name, phone, date, time, treatment, price: parseFloat(price) || 0 };
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    data.push(newApp);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    loadAppointments();

    feedback.style.display = 'block';
    setTimeout(() => feedback.style.display = 'none', 3000);

    // Limpar campos (menos tratamento/valor)
    document.getElementById('name').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('date').value = '';
    document.getElementById('time').value = '';
    // Mantém tratamento e valor
  });

  // ============================================================
  //  CHAT BOT (com opções)
  // ============================================================
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');

  let step = 0;
  let selectedTreatment = null;
  let selectedUrgency = null;

  const steps = {
    0: {
      text: 'Olá! 👋 Qual tratamento você procura?',
      choices: [
        { label: '🦷 Limpeza', value: 'Limpeza Profissional' },
        { label: '🦷 Clareamento', value: 'Clareamento a Laser' },
        { label: '🦷 Restauração', value: 'Restauração com Resina' },
        { label: '🦷 Extração', value: 'Extração Simples' },
        { label: '🦷 Outro', value: 'Consulta + Avaliação' },
      ]
    },
    1: {
      text: 'Qual a urgência?',
      choices: [
        { label: '🔴 Urgente', value: 'urgente' },
        { label: '🟡 Normal', value: 'normal' },
        { label: '🟢 Sem pressa', value: 'tranquilo' },
      ]
    },
    2: {
      text: 'Ótimo! Com base nisso, sugiro:',
      choices: [
        { label: '✅ Confirmar', value: 'confirm' },
        { label: '🔄 Recomeçar', value: 'reset' },
      ]
    }
  };

  function addMessage(role, text, choices = null) {
    const div = document.createElement('div');
    div.className = `message ${role === 'bot' ? 'bot' : 'user'}`;
    div.innerHTML = text;
    if (choices) {
      const grid = document.createElement('div');
      grid.className = 'options-grid';
      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = choice.label;
        btn.dataset.value = choice.value;
        btn.addEventListener('click', () => handleChoice(choice.value, choice.label));
        grid.appendChild(btn);
      });
      div.appendChild(grid);
    }
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function handleChoice(value, label) {
    addMessage('user', label);
    if (step === 0) {
      selectedTreatment = value;
      step = 1;
      setTimeout(() => {
        addMessage('bot', steps[1].text, steps[1].choices);
      }, 300);
    } else if (step === 1) {
      selectedUrgency = value;
      step = 2;
      let basePrice = priceMap[selectedTreatment] || 150;
      if (value === 'urgente') basePrice += 80;
      const sugText = `💡 **${selectedTreatment}** – R$ ${basePrice.toFixed(2)}<br><br>${steps[2].text}`;
      // Preenche formulário
      document.getElementById('treatment').value = selectedTreatment;
      document.getElementById('price').value = basePrice.toFixed(2);
      setTimeout(() => {
        addMessage('bot', sugText, steps[2].choices);
      }, 300);
    } else if (step === 2) {
      if (value === 'confirm') {
        addMessage('bot', '✔️ Ótimo! Preencha os dados e confirme o agendamento.');
        // Não reinicia, deixa o usuário agendar
      } else {
        // reset
        step = 0;
        selectedTreatment = null;
        selectedUrgency = null;
        chatMessages.innerHTML = '';
        setTimeout(() => {
          addMessage('bot', steps[0].text, steps[0].choices);
        }, 200);
      }
    }
  }

  function sendTextMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    addMessage('user', text);
    chatInput.value = '';
    // Resposta genérica
    setTimeout(() => {
      if (step === 0) {
        addMessage('bot', steps[0].text, steps[0].choices);
      } else if (step === 1) {
        addMessage('bot', steps[1].text, steps[1].choices);
      } else {
        addMessage('bot', 'Use os botões para confirmar ou recomeçar.', steps[2].choices);
      }
    }, 400);
  }

  chatSend.addEventListener('click', sendTextMessage);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendTextMessage(); });

  // Inicializa o chat
  addMessage('bot', steps[0].text, steps[0].choices);

  // Inicializa lista
  loadAppointments();

  // Data mínima (hoje)
  document.getElementById('date').min = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
